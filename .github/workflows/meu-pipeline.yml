
name: Meu Primeiro Pipeline de CI/CD

on:
  push:
    branches: [main]

jobs:
  teste-dos-arquivos:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar o codigo
        uses: actions/checkout@v4

      - name: Verificar arquivo HTML
        run: ls index.html

  simular-deploy:
    needs: teste-dos-arquivos
    runs-on: ubuntu-latest
    steps:
      - name: Simular envio para servidor
        run: |
          echo "Conectando ao servidor..."
          echo "Enviando arquivo index.html..."
          echo "Sucesso! Site online (Simulado)."
